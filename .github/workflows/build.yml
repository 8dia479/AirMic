name: Build and test AirMic
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Managed protocol / jitter / UDP / allocation tests
        shell: pwsh
        run: |
          dotnet run --project windows/AirMic.Tests -c Release *> managed-tests.log
          $code = $LASTEXITCODE
          Get-Content managed-tests.log
          if ($code -eq 0) {
            $summary = (Get-Content managed-tests.log | Where-Object { $_ -match 'PASS:|allocation guard:|VIRTUAL' }) -join '%0A'
            Write-Host "::notice title=Managed core result::$summary"
          }
          if ($code -ne 0) {
            $tail = (Get-Content managed-tests.log -Tail 35) -join '%0A'
            Write-Host "::error title=Managed build/test failure::$tail"
            exit $code
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-test-log-${{ matrix.os }}
          path: managed-tests.log
  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: WPF build (no C++ workload needed)
        shell: pwsh
        run: |
          dotnet build windows/AirMic.sln -c Release *> windows-build.log
          $code = $LASTEXITCODE
          Get-Content windows-build.log
          if ($code -ne 0) {
            $tail = (Get-Content windows-build.log -Tail 35) -join '%0A'
            Write-Host "::error title=Windows build failure::$tail"
            exit $code
          }
      - name: Create and close actual WPF window (no audio hardware test)
        shell: pwsh
        run: |
          $app = Start-Process windows/AirMic.App/bin/Release/net10.0-windows/AirMic.exe -ArgumentList '--smoke-ui' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'WPF smoke timed out' }
          if ($app.ExitCode -ne 0) { throw "WPF smoke failed: $($app.ExitCode)" }
      - name: Publish standalone diagnostic executable + exact runtime notices (NO driver)
        shell: pwsh
        run: |
          try {
            ./tools/publish_windows.ps1 -DiagnosticOnly *> publish.log
            Get-Content publish.log
          } catch {
            Get-Content publish.log -ErrorAction SilentlyContinue
            $tail = ((Get-Content publish.log -Tail 30 -ErrorAction SilentlyContinue) -join "`n") + "`n" + $_.Exception.Message
            Write-Host ("::error title=Single EXE publish::" + $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AirMic-windows-x64-DIAGNOSTIC-NO-DRIVER
          path: artifacts/windows-diagnostic/
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK (no obsolete tools package, NDK or CMake)
        shell: bash
        run: |
          set -o pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            echo "::error::Preinstalled Android SDK command-line tools missing: $manager"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          # Hosted images already have accepted licenses; install only what this app needs.
          if ! "$manager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" > sdk-install.log 2>&1; then
            cat sdk-install.log
            python3 -c 'from pathlib import Path; s=Path("sdk-install.log").read_text()[-6000:]; print("::error title=SDK setup::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
          cat sdk-install.log
      - name: Verify Gradle wrapper
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Kotlin JVM tests / APK / lint
        working-directory: android
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace > ../android-build.log 2>&1
          result=$?
          set -e
          cat ../android-build.log
          python3 - "$result" <<'PYTEST'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as E
          def annotation(level, title, message):
              text = str(message).replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print(f'::{level} title={title}::{text}')
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          counts = {key: 0 for key in ('tests','failures','errors','skipped')}
          metrics = []
          for report in reports:
              root = E.parse(report).getroot()
              for key in counts: counts[key] += int(root.get(key, '0'))
              for case in root.findall('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      annotation('error', 'Kotlin fixture', case.get('name','') + ': ' + (failure.text or failure.get('message',''))[:4000])
              for output in root.iter('system-out'):
                  metrics += [line for line in (output.text or '').splitlines() if line.startswith('DSP_METRIC ')]
          if metrics: annotation('notice', 'Kotlin DSP measurements', '\n'.join(metrics))
          built = sys.argv[1] == '0'
          annotation('notice', 'Kotlin tests', str(counts) + ('; APK and lint completed' if built else '; build failed, see log') + '; AudioRecord hardware not tested')
          if built:
              assert reports and counts['tests'] >= 16 and counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          PYTEST
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; s=Path("../android-build.log").read_text(); lines=[x for x in s.splitlines() if any(y in x for y in ("e: "," error:","Error:","What went wrong","Execution failed"))]; text="\n".join(lines or s.splitlines()[-35:])[-6000:]; print("::error title=Android build failure::"+text.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit "$result"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-results
          path: |
            android-build.log
            android/app/build/reports/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/outputs/apk/debug/app-debug.apk
  legacy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/requirements-latency.txt
      - run: python -m unittest discover -s tests -p 'python_test_*.py' -v

  driver-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Actual kernel history header / host regression + ASan + UBSan
        run: |
          mkdir -p build/driver-tests
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer driver/tests/audio_history_tests.cpp -o build/driver-tests/history
          build/driver-tests/history
  driver-compile:
    # Same native toolchain family used by the pinned Microsoft driver-samples CI.
    # This is deliberately separate from the managed app / Kotlin build jobs.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Build real AirMic render-to-capture driver / validate unsigned catalog
        shell: pwsh
        run: |
          try {
            ./tools/build_driver.ps1 *> driver-build.log
            Get-Content driver-build.log
          } catch {
            Get-Content driver-build.log -ErrorAction SilentlyContinue
            $lines = Get-Content driver-build.log -ErrorAction SilentlyContinue | Where-Object { $_ -match 'error|failed|Exception|warning' } | Select-Object -Last 25
            $text = (($lines -join "`n") + "`n" + $_.Exception.Message)
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Native driver build::$text"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AirMic-driver-UNSIGNED-NOT-A-RELEASE
          path: |
            driver-build.log
            build/driver/unsigned/
